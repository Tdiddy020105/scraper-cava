<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scraper</title>
  <style>
    :root {
      --ink: #1c1915;
      --muted: #5e584f;
      --line: #e4ddd2;
      --paper: #f6f1e8;
      --card: #fffdf9;
      --accent: #9a3b12;
      --accent-soft: #f3e2d6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 16px/1.45 "Segoe UI", system-ui, sans-serif;
    }
    header, main { width: min(760px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 28px 0 0; }
    h1 { margin: 0; font-size: 34px; letter-spacing: -0.04em; }
    form {
      margin: 22px 0;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .bestemmingen { display: flex; flex-wrap: wrap; gap: 10px 18px; margin: 0 0 12px; }
    .bestemmingen label {
      flex-direction: row;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      color: var(--ink);
      font-size: 15px;
    }
    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      min-height: 40px;
      font: inherit;
      cursor: pointer;
    }
    button.primary {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
    input {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 9px 10px;
      min-height: 44px;
      font: inherit;
      font-size: 16px;
      color: var(--ink);
    }
    input::placeholder { color: #a3988c; }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      min-width: 18px;
      min-height: 18px;
      padding: 0;
      flex: 0 0 18px;
      accent-color: var(--ink);
    }
    .suggest { position: relative; }
    .suggest ul {
      position: absolute;
      z-index: 2;
      left: 0; right: 0; top: calc(100% + 4px);
      margin: 0; padding: 4px;
      list-style: none;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .suggest li { padding: 10px 8px; border-radius: 6px; cursor: pointer; }
    .suggest li:hover { background: var(--accent-soft); }
    .status { color: var(--muted); min-height: 1.4em; }
    .kaart {
      display: grid;
      gap: 6px;
      padding: 16px 0;
      border-top: 1px solid var(--line);
    }
    .kaart h2 { margin: 0; font-size: 18px; letter-spacing: -0.02em; overflow-wrap: anywhere; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 14px; }
    .pill {
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
    }
    .acties { display: flex; flex-wrap: wrap; gap: 8px; }
    .acties a {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      min-height: 40px;
      text-decoration: none;
    }
    .pager { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 40px; }
    .note { margin: 28px 0 48px; color: var(--muted); font-size: 13px; }
    .fout { color: var(--accent); }
    .leeg { margin: 0; }
    .vouw { display: none; }
    @media (max-width: 800px) {
      header, main { width: min(760px, calc(100% - 24px)); }
      header { padding-top: 16px; }
      h1 { font-size: 28px; }
      form { padding: 0; }
      form.is-dicht {
        position: sticky;
        top: 8px;
        z-index: 4;
        box-shadow: 0 10px 24px rgba(28, 25, 21, 0.08);
      }
      form.is-dicht .filters { display: none; }
      .vouw {
        display: flex;
        width: 100%;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        border: 0;
        border-radius: 14px;
        background: transparent;
        color: var(--ink);
        min-height: 56px;
        padding: 10px 14px;
        text-align: left;
      }
      .vouw-kop { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .vouw-kop strong { font-size: 16px; }
      .vouw-tekst {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      form:not(.is-dicht) .vouw-tekst { display: none; }
      .vouw-pijl {
        width: 9px;
        height: 9px;
        flex: 0 0 9px;
        border-right: 2px solid var(--ink);
        border-bottom: 2px solid var(--ink);
        transform: rotate(-135deg);
        margin-top: 4px;
      }
      form.is-dicht .vouw-pijl { transform: rotate(45deg); margin-top: -4px; }
      .filters { padding: 0 12px 12px; }
      .grid { grid-template-columns: 1fr; }
      button.primary, .acties a, .acties button { width: 100%; text-align: center; }
      .kaart h2 { font-size: 17px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Scraper</h1>
  </header>
  <main>
    <form id="zoek" class="is-dicht">
      <button type="button" class="vouw" id="vouw" aria-expanded="false" aria-controls="filters">
        <span class="vouw-kop">
          <strong>Zoeken</strong>
          <span class="vouw-tekst" id="vouwtekst"></span>
        </span>
        <span class="vouw-pijl" aria-hidden="true"></span>
      </button>
      <div id="filters" class="filters">
        <div class="bestemmingen">
          <label><input type="checkbox" name="term" value="logies" checked>Logies</label>
          <label><input type="checkbox" name="term" value="kamerverhuur" checked>Kamerverhuur</label>
        </div>
        <div class="grid">
          <label class="suggest">Gemeente
            <input id="gemeente" name="gemeente" placeholder="Amsterdam" autocomplete="off">
            <ul id="suggesties" hidden></ul>
          </label>
          <label>Plaats
            <input id="plaats" name="plaats" placeholder="Leeg = hele gemeente" autocomplete="off">
          </label>
          <button class="primary" type="submit">Zoek</button>
        </div>
      </div>
    </form>
    <p id="status" class="status"></p>
    <div id="lijst"></div>
    <div id="pager" class="pager"></div>
    <p class="note">Adressen waarvan het plan logies of kamerverhuur noemt.</p>
  </main>
  <script>
    const form = document.querySelector("#zoek");
    const vouw = document.querySelector("#vouw");
    const vouwTekst = document.querySelector("#vouwtekst");
    const smal = window.matchMedia("(max-width: 800px)");
    const status = document.querySelector("#status");
    const lijst = document.querySelector("#lijst");
    const pager = document.querySelector("#pager");
    const suggesties = document.querySelector("#suggesties");
    const gemeente = document.querySelector("#gemeente");
    let pagina = 1;
    let timer;
    let verzoek = 0;

    function gekozenTermen() {
      return [...document.querySelectorAll("input[name=term]:checked")];
    }

    function filterTekst() {
      const termen = gekozenTermen().map((input) => input.parentElement.textContent.trim());
      const delen = [];
      if (termen.length) delen.push(termen.join(", "));
      const gemeenteNaam = gemeente.value.trim();
      const plaats = document.querySelector("#plaats").value.trim();
      if (gemeenteNaam) delen.push(gemeenteNaam);
      if (plaats) delen.push(plaats);
      return delen.join(" · ");
    }

    function zetFilters(open) {
      form.classList.toggle("is-dicht", !open);
      vouw.setAttribute("aria-expanded", String(open));
      vouwTekst.textContent = filterTekst();
    }

    vouw.addEventListener("click", () => zetFilters(form.classList.contains("is-dicht")));
    form.addEventListener("change", () => { vouwTekst.textContent = filterTekst(); });
    form.addEventListener("input", () => { vouwTekst.textContent = filterTekst(); });
    zetFilters(!smal.matches);

    gemeente.addEventListener("input", () => {
      clearTimeout(timer);
      const term = gemeente.value.trim();
      if (term.length < 2) {
        suggesties.hidden = true;
        return;
      }
      timer = setTimeout(async () => {
        let data;
        try {
          const response = await fetch("/api/gemeenten?q=" + encodeURIComponent(term));
          data = await leesJson(response);
        } catch (error) {
          return;
        }
        suggesties.innerHTML = "";
        data.gemeenten.forEach((naam) => {
          const item = document.createElement("li");
          item.textContent = naam;
          item.addEventListener("click", () => {
            gemeente.value = naam;
            suggesties.hidden = true;
            vouwTekst.textContent = filterTekst();
          });
          suggesties.appendChild(item);
        });
        suggesties.hidden = data.gemeenten.length === 0;
      }, 180);
    });

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".suggest")) suggesties.hidden = true;
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      suggesties.hidden = true;
      pagina = 1;
      zoek({ invouwen: true });
    });

    function params() {
      const query = new URLSearchParams();
      const termen = gekozenTermen().map((input) => input.value);
      if (termen.length) query.set("bestemming", termen.join(","));
      for (const id of ["gemeente", "plaats"]) {
        const value = document.querySelector("#" + id).value.trim();
        if (value) query.set(id, value);
      }
      query.set("page", String(pagina));
      return query;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[char]);
    }

    async function leesJson(response) {
      const tekst = await response.text();
      try {
        return JSON.parse(tekst);
      } catch (error) {
        throw new Error("De zoekserver antwoordt niet. Open http://127.0.0.1:8765 terwijl python server.py draait.");
      }
    }

    async function zoek({ invouwen = false } = {}) {
      const termen = gekozenTermen();
      if (termen.length === 0) {
        status.innerHTML = `<span class="fout">Vink logies of kamerverhuur aan.</span>`;
        lijst.innerHTML = "";
        pager.innerHTML = "";
        return;
      }
      if (!gemeente.value.trim() && !document.querySelector("#plaats").value.trim()) {
        status.innerHTML = `<span class="fout">Vul een gemeente of een plaats in.</span>`;
        lijst.innerHTML = "";
        pager.innerHTML = "";
        return;
      }
      const huidig = ++verzoek;
      status.textContent = "Adressen opzoeken…";
      lijst.innerHTML = "";
      pager.innerHTML = "";
      let data;
      try {
        const response = await fetch("/api/panden?" + params().toString());
        if (huidig !== verzoek) return;
        data = await leesJson(response);
      } catch (error) {
        if (huidig !== verzoek) return;
        status.innerHTML = `<span class="fout">${escapeHtml(error.message || "Zoeken is mislukt.")}</span>`;
        return;
      }
      if (huidig !== verzoek) return;
      if (data.fout) {
        status.innerHTML = `<span class="fout">${escapeHtml(data.fout)}</span>`;
        return;
      }
      const aantal = data.totaal.toLocaleString("nl-NL");
      const extra = data.afgekapt ? (data.totaal >= 400 ? "De lijst is afgekapt op 400 adressen." : "Er zijn meer plannen dan deze lijst heeft doorzocht.") : "";
      status.textContent = extra ? `${aantal} adressen. ${extra}` : `${aantal} adressen.`;
      if (invouwen && smal.matches) zetFilters(false);
      if (data.resultaten.length === 0) {
        const gekozen = termen.map((input) => input.value);
        const genoemd = gekozen.length < 2
          ? gekozen[0]
          : `${gekozen.slice(0, -1).join(", ")} of ${gekozen.at(-1)}`;
        const zinnen = [`Geen adressen gevonden waarvan het plan ${genoemd} noemt.`];
        if (data.geenVlak) zinnen.push("De landelijke kaart heeft voor deze gemeente geen vlak met die naam.");
        else if (gekozen.length === 1 && gekozen[0] === "kamerverhuur") zinnen.push("Er is wel een vlak, maar daar staat geen BAG-adres in.");
        lijst.innerHTML = `<p class="leeg">${zinnen.map(escapeHtml).join(" ")}</p>`;
        return;
      }
      lijst.innerHTML = data.resultaten.map((item) => `
        <article class="kaart">
          <div class="meta">
            <span class="pill">${escapeHtml(item.bestemming || "plan")}</span>
            <span>${escapeHtml(item.woonplaats || item.gemeente || "")}</span>
          </div>
          <h2>${escapeHtml(item.adres)}</h2>
          <div class="acties">
            ${item.lat && item.lon ? `<a href="https://www.openstreetmap.org/directions?to=${item.lat}%2C${item.lon}" target="_blank" rel="noopener">Route</a>` : ""}
            <button type="button" data-kopieer="${escapeHtml(item.adres)}">Kopieer adres</button>
          </div>
        </article>
      `).join("");
      toonPager(data.totaal, data.perPagina);
    }

    function toonPager(totaal, perPagina) {
      const paginaAantal = Math.ceil(totaal / perPagina);
      if (paginaAantal <= 1) return;
      const vorige = document.createElement("button");
      vorige.type = "button";
      vorige.textContent = "Vorige";
      vorige.disabled = pagina <= 1;
      vorige.addEventListener("click", () => { pagina -= 1; zoek(); });
      const volgende = document.createElement("button");
      volgende.type = "button";
      volgende.textContent = "Volgende";
      volgende.disabled = pagina >= paginaAantal;
      volgende.addEventListener("click", () => { pagina += 1; zoek(); });
      const label = document.createElement("span");
      label.textContent = `Pagina ${pagina} van ${paginaAantal.toLocaleString("nl-NL")}`;
      pager.append(vorige, label, volgende);
    }

    lijst.addEventListener("click", async (event) => {
      const kopie = event.target.closest("[data-kopieer]");
      if (!kopie) return;
      const adres = kopie.dataset.kopieer;
      try {
        await navigator.clipboard.writeText(adres);
        kopie.textContent = "Gekopieerd";
      } catch (error) {
        kopie.textContent = adres;
      }
    });
  </script>
</body>
</html>
